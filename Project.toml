[deps]
Statistics = "10745b16-79ce-11e8-11f9-7d13ad32a3b2"
StatsBase = "2913bbd2-ae8a-5f71-8c99-4fb6c76f3a91"
DataFrames = "a93c6f00-e57d-5684-b7b6-d8193f3e46c0"
CSV = "336ed68f-0bac-5ca0-87d4-7b16caf5d00b"
Dates = "ade2ca70-3891-5945-98fb-dc099432e06a"
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"

[weakdeps]
# Real packages registered in Julia General registry:
AMDGPU = "21141c5a-9bdb-4563-92ae-f87d6854732e"
CUDA = "052768ef-5323-5732-b1bb-66c8b64840ba"
KernelAbstractions = "63c18a36-062a-441e-b654-da1e3ab1ce7c"
Metal = "dde4c033-4e86-420c-a63e-0dd931031962"
# Removed: CryptoAccel, DSPLibs, FPGASynthesis, MathAccel, NPUAccel, PPUCompute,
# QPUInterface, TPUCompute, VPURuntime — all had placeholder/fake UUIDs and are not
# registered in Julia General; their extensions are kept in ext/ as stubs but
# excluded from the project graph until real packages are available.

[extensions]
CliometricsCUDAExt = ["CUDA", "KernelAbstractions"]
CliometricsROCmExt = ["AMDGPU", "KernelAbstractions"]
CliometricsMetalExt = ["Metal", "KernelAbstractions"]

[compat]
julia = "1.9"
Statistics = "1"
StatsBase = "0.33, 0.34"
DataFrames = "1"
CSV = "0.10"

[extras]
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

[targets]
test = ["Test"]
