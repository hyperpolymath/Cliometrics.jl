[tools]
# Language runtimes
julia = "latest"
zig = "latest"
bun = "latest"

# Formatting & Linting
shfmt = "latest"
stylua = "latest"

# Build tools
cmake = "latest"
ninja = "latest"

# Shell tools
git = "latest"
gnu-sed = "latest"
gnu-tar = "latest"
gnu-grep = "latest"

# Testing

[env]
# Common environment variables


[tasks.build]
run = 'julia --project=. -e 'using Pkg; Pkg.instantiate()''

[tasks.test]
run = 'julia --project=. -e 'using Pkg; Pkg.test()''

[tasks.lint]
run = 'bun install --frozen-lockfile && bunx --no-install --bun prettier --check .'

[tasks.fmt]
run = 'bun install --frozen-lockfile && bunx --no-install --bun prettier --write .'
