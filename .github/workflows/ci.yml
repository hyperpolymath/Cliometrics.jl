# This workflow is managed by gh actions-lock.
# This workflow is managed by gh actions-lock.
name: CI
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Julia ${{ matrix.julia-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10', '1.11']
        os: [ubuntu-latest]
        include:
          - julia-version: '1.11'
            os: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: julia-actions/setup-julia@v3.0.2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v3.3.0
      - name: Install, build, test
        # AcceleratorGate.jl is not yet published; develop the vendored stub at
        # stub/AcceleratorGate (registry-free, works on 1.10 and 1.11) before
        # resolving the registered deps. Replace with the real package later.
        run: julia --project=. -e 'using Pkg; Pkg.develop(path="stub/AcceleratorGate"); Pkg.instantiate(); Pkg.build(); Pkg.test()'
