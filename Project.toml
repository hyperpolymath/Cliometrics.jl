# NOTE: the coprocessor acceleration layer is PARKED, not removed.
# src/backends/abstract.jl, src/coprocessors/*.jl and ext/Cliometrics*Ext.jl
# are written against the AcceleratorGate.jl shared-dispatch API, which is not
# yet a published/registered package (its UUID here was a placeholder, so
# `Pkg.instantiate()` could never resolve it). The AcceleratorGate dep, the
# [weakdeps] and the [extensions] tables have been removed so the core package
# instantiates and tests cleanly; the source is retained in-tree to be re-wired
# once AcceleratorGate is real. See the AcceleratorGate tracking issue.

[deps]
Statistics = "10745b16-79ce-11e8-11f9-7d13ad32a3b2"
StatsBase = "2913bbd2-ae8a-5f71-8c99-4fb6c76f3a91"
